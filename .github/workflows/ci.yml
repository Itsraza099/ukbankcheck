name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UKBANKCHECK_DATA_DIR: ${{ github.workspace }}/.vocalink
  UKBANKCHECK_REQUIRE_TABLES: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: Download Vocalink tables
        # Not committed to the repo (licence; see docs/decisions/0002). Fetching them
        # here also means CI fails if Vocalink changes the page or the file format.
        run: uv run python -m ukbankcheck download --dest "$UKBANKCHECK_DATA_DIR"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
